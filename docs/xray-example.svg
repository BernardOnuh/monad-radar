<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" rx="20" fill="#0b0a12"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#ece9f7">Token X-ray · $NADCAT <tspan fill="#9690b0" font-size="15" font-weight="400">(fictional token, illustrative data)</tspan></text>

  <!-- holder map card -->
  <rect x="40" y="72" width="700" height="460" rx="16" fill="#13111d" stroke="#2a2540"/>
  <text x="64" y="104" font-size="16" font-weight="600" fill="#ece9f7">Holder map</text>
  <text x="64" y="124" font-size="12" fill="#9690b0">Top 40 holders sized by % of supply · linked wallets grouped and colored</text>

  <!-- cluster 1 (red) -->
  <circle cx="260" cy="300" r="128" fill="#ff5c7a" fill-opacity="0.08" stroke="#ff5c7a" stroke-dasharray="5 4"/>
  <circle cx="215" cy="262" r="62" fill="#ff5c7a" fill-opacity="0.9"/><text x="215" y="267" text-anchor="middle" font-size="14" fill="#fff">14.2%</text>
  <circle cx="322" cy="245" r="44" fill="#ff5c7a" fill-opacity="0.9"/><text x="322" y="250" text-anchor="middle" font-size="12" fill="#fff">8.1%</text>
  <circle cx="290" cy="345" r="50" fill="#ff5c7a" fill-opacity="0.9"/><text x="290" y="350" text-anchor="middle" font-size="12" fill="#fff">9.6%</text>
  <circle cx="205" cy="360" r="36" fill="#ff5c7a" fill-opacity="0.9"/><text x="205" y="364" text-anchor="middle" font-size="11" fill="#fff">5.3%</text>
  <circle cx="352" cy="318" r="22" fill="#ff5c7a" fill-opacity="0.9"/>
  <!-- cluster 2 (yellow) -->
  <circle cx="470" cy="225" r="62" fill="#ffc857" fill-opacity="0.08" stroke="#ffc857" stroke-dasharray="5 4"/>
  <circle cx="450" cy="215" r="34" fill="#ffc857" fill-opacity="0.9"/><text x="450" y="219" text-anchor="middle" font-size="11" fill="#0b0a12">4.4%</text>
  <circle cx="497" cy="247" r="24" fill="#ffc857" fill-opacity="0.9"/>
  <!-- pool -->
  <circle cx="500" cy="390" r="70" fill="#2f2a45"/><text x="500" y="386" text-anchor="middle" font-size="12" fill="#9690b0">Uniswap pool</text><text x="500" y="404" text-anchor="middle" font-size="12" fill="#9690b0">18.0%</text>
  <!-- independents -->
  <g fill="#6b6390">
    <circle cx="590" cy="250" r="26"/><circle cx="620" cy="320" r="20"/><circle cx="585" cy="180" r="16"/>
    <circle cx="640" cy="200" r="14"/><circle cx="410" cy="300" r="18"/><circle cx="400" cy="460" r="15"/>
    <circle cx="610" cy="450" r="17"/><circle cx="660" cy="390" r="12"/><circle cx="120" cy="450" r="13"/>
    <circle cx="110" cy="180" r="15"/><circle cx="380" cy="150" r="13"/><circle cx="660" cy="270" r="11"/>
  </g>
  <circle cx="560" cy="140" r="9" fill="#3a6ea8"/>
  <g font-size="12" fill="#ece9f7">
    <circle cx="64" cy="508" r="6" fill="#ff5c7a"/><text x="76" y="512">Cluster #1 · 5 wallets · 39.4% · same first funder 0x7a3f…c21e</text>
    <circle cx="470" cy="508" r="6" fill="#ffc857"/><text x="482" y="512">Cluster #2 · 2 wallets · 6.6%</text>
  </g>

  <!-- risk gauge card -->
  <rect x="760" y="72" width="400" height="460" rx="16" fill="#13111d" stroke="#2a2540"/>
  <text x="784" y="104" font-size="16" font-weight="600" fill="#ece9f7">Risk score</text>
  <g transform="translate(960 220)">
    <path d="M-100 0 A100 100 0 0 1 100 0" fill="none" stroke="#2a2540" stroke-width="20" stroke-linecap="round"/>
    <path d="M-100 0 A100 100 0 0 1 100 0" fill="none" stroke="#ff5c7a" stroke-width="20" stroke-linecap="round" stroke-dasharray="251 314"/>
    <text y="-14" text-anchor="middle" font-size="46" font-weight="700" fill="#ece9f7">80</text>
    <text y="14" text-anchor="middle" font-size="13" fill="#ff5c7a" font-weight="600">SEVERE RISK</text>
  </g>
  <g font-size="13" fill="#ece9f7">
    <text x="784" y="276">Connected wallets</text><text x="1136" y="276" text-anchor="end" fill="#9690b0">30/30</text>
    <rect x="784" y="284" width="352" height="6" rx="3" fill="#1a1727"/><rect x="784" y="284" width="352" height="6" rx="3" fill="#ff5c7a"/>
    <text x="784" y="316">Holder concentration</text><text x="1136" y="316" text-anchor="end" fill="#9690b0">25/25</text>
    <rect x="784" y="324" width="352" height="6" rx="3" fill="#1a1727"/><rect x="784" y="324" width="352" height="6" rx="3" fill="#ff5c7a"/>
    <text x="784" y="356">Winners exiting</text><text x="1136" y="356" text-anchor="end" fill="#9690b0">15/15</text>
    <rect x="784" y="364" width="352" height="6" rx="3" fill="#1a1727"/><rect x="784" y="364" width="352" height="6" rx="3" fill="#ff5c7a"/>
    <text x="784" y="396">Fresh-wallet buying</text><text x="1136" y="396" text-anchor="end" fill="#9690b0">5/10</text>
    <rect x="784" y="404" width="352" height="6" rx="3" fill="#1a1727"/><rect x="784" y="404" width="176" height="6" rx="3" fill="#ffc857"/>
    <text x="784" y="436">Thin liquidity</text><text x="1136" y="436" text-anchor="end" fill="#9690b0">5/10</text>
    <rect x="784" y="444" width="352" height="6" rx="3" fill="#1a1727"/><rect x="784" y="444" width="176" height="6" rx="3" fill="#ffc857"/>
    <text x="784" y="476">Exchange deposits</text><text x="1136" y="476" text-anchor="end" fill="#9690b0">0/10</text>
    <rect x="784" y="484" width="352" height="6" rx="3" fill="#1a1727"/>
  </g>
  <text x="784" y="516" font-size="11" fill="#9690b0">Every factor shows its evidence in the app.</text>
</svg>
