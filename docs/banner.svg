<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="20%" cy="0%" r="80%">
      <stop offset="0" stop-color="#836ef9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0b0a12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a594ff"/>
      <stop offset="1" stop-color="#5b45e0"/>
    </linearGradient>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="#0b0a12"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <!-- radar rings bg -->
  <g transform="translate(1010 180)" fill="none" stroke="#836ef9">
    <circle r="150" stroke-opacity="0.15"/>
    <circle r="105" stroke-opacity="0.22"/>
    <circle r="60" stroke-opacity="0.3"/>
    <path d="M0 0 L0 -150 A150 150 0 0 1 142 -48 Z" fill="url(#sw)" stroke="none" opacity="0.25"/>
    <circle cx="70" cy="-90" r="9" fill="#ff5c7a" stroke="none"/>
    <circle cx="92" cy="-70" r="6" fill="#ff5c7a" stroke="none"/>
    <circle cx="58" cy="-62" r="5" fill="#ff5c7a" stroke="none"/>
    <circle cx="-80" cy="40" r="7" fill="#6b6390" stroke="none"/>
    <circle cx="30" cy="95" r="5" fill="#6b6390" stroke="none"/>
    <circle cx="-40" cy="-110" r="4" fill="#3ddc97" stroke="none"/>
  </g>
  <!-- logo -->
  <g transform="translate(72 70) scale(2.2)">
    <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#lg)"/>
    <circle cx="16" cy="16" r="10" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="6" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.2"/>
    <path d="M16 16 L16 6 A10 10 0 0 1 25.5 12.9 Z" fill="url(#sw)" opacity="0.55"/>
    <line x1="16" y1="16" x2="16" y2="6" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="16" cy="16" r="1.8" fill="#fff"/>
    <circle cx="21.5" cy="11" r="1.6" fill="#3ddc97"/>
  </g>
  <text x="160" y="118" font-size="44" font-weight="700" fill="#ece9f7">Monad <tspan fill="#a594ff">Radar</tspan></text>
  <text x="72" y="200" font-size="34" font-weight="700" fill="#ece9f7">Who <tspan fill="#a594ff">really</tspan> controls that token?</text>
  <text x="72" y="244" font-size="20" fill="#9690b0">Holder clusters · insider links · cohort flows · AI risk verdict · alerts</text>
  <g font-size="15" font-weight="600">
    <rect x="72" y="278" width="190" height="36" rx="18" fill="#836ef9" fill-opacity="0.18" stroke="#836ef9" stroke-opacity="0.5"/>
    <text x="167" y="301" text-anchor="middle" fill="#a594ff">Powered by Nansen</text>
    <rect x="276" y="278" width="150" height="36" rx="18" fill="#3ddc97" fill-opacity="0.12" stroke="#3ddc97" stroke-opacity="0.5"/>
    <text x="351" y="301" text-anchor="middle" fill="#3ddc97">Built on Monad</text>
  </g>
</svg>
